[package]
name = "voanisa-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opus-pure = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "flac", "pcm", "wav", "aiff", "caf", "mp3", "aac", "alac", "isomp4", "mkv", "ape"] }
