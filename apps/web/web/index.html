<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voanisa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <img src="icon.png" alt="" class="brand-icon">
                <span class="brand-name">Voanisa</span>
            </div>
            <nav class="nav">
                <button class="nav-item is-active" data-view="songs">歌曲</button>
            </nav>
        </aside>

        <main class="content">
            <header class="list-header">
                <h1>歌曲</h1>
                <span class="count" id="track-count"></span>
            </header>
            <ul class="track-list" id="track-list"></ul>
            <p class="empty" id="empty-state" hidden>曲库里还没有歌曲。</p>
        </main>

        <footer class="player">
            <div class="now-playing">
                <span class="np-title" id="np-title">未在播放</span>
                <span class="np-artist" id="np-artist"></span>
            </div>

            <div class="transport">
                <button class="skip" id="prev-button" title="上一首（⌥← / Alt+←）">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="4" y="5" width="2.6" height="14" rx="1"/>
                        <path d="M20 5.6v12.8c0 .8-.9 1.3-1.6.9l-9.3-6.4a1 1 0 0 1 0-1.8l9.3-6.4c.7-.4 1.6.1 1.6.9z"/>
                    </svg>
                </button>
                <button class="play" id="play-button" title="播放 / 暂停（空格）">
                    <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 4.8v14.4c0 .9 1 1.4 1.7 1l11-7.2a1 1 0 0 0 0-1.9L9.7 3.8c-.7-.4-1.7.1-1.7 1z"/>
                    </svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="6" y="4" width="4" height="16" rx="1.4"/>
                        <rect x="14" y="4" width="4" height="16" rx="1.4"/>
                    </svg>
                </button>
                <button class="skip" id="next-button" title="下一首（⌥→ / Alt+→）">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 5.6v12.8c0 .8.9 1.3 1.6.9l9.3-6.4a1 1 0 0 0 0-1.8L5.6 4.7C4.9 4.3 4 4.8 4 5.6z"/>
                        <rect x="17.4" y="5" width="2.6" height="14" rx="1"/>
                    </svg>
                </button>
                <button class="skip" id="repeat-button" title="循环">
                    <svg class="icon-repeat" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 7h8.2a4 4 0 0 1 0 8H13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M9.6 4.2 6.8 7l2.8 2.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 17H8.8a4 4 0 0 1 0-8H12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M14.4 19.8 17.2 17l-2.8-2.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>

            <div class="progress">
                <span class="time" id="position">0:00</span>
                <input type="range" id="seek-bar" min="0" max="1000" value="0">
                <span class="time" id="duration">0:00</span>
            </div>

            <div class="volume">
                <span class="vol-icon">🔈</span>
                <input type="range" id="volume-bar" min="0" max="100" value="80">
            </div>
        </footer>
    </div>

    <div class="context-menu" id="context-menu" hidden>
        <button data-action="play">播放</button>
        <button data-action="reveal">在 Finder 中显示</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
