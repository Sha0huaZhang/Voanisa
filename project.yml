name: Voanisa
options:
  bundleIdPrefix: org.macwave
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Voanisa:
    type: application
    platform: macOS
    sources:
      - path: Voanisa
    preBuildScripts:
      - name: Build Rust core
        script: "$SRCROOT/Scripts/build-rust.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.macwave.Voanisa
        PRODUCT_NAME: Voanisa
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Voanisa
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Sha0huaZhang. MIT License."
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Voanisa/RustBridge/VoanisaCore.h"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Rust/build"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Rust/build"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lvoanisa_ffi"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES

  VoanisaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VoanisaTests
        excludes:
          - Fixtures
    dependencies:
      - target: Voanisa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.macwave.VoanisaTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Voanisa.app/Contents/MacOS/Voanisa"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Voanisa:
    build:
      targets:
        Voanisa: all
        VoanisaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - VoanisaTests
